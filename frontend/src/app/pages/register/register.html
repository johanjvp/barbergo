<app-navbar></app-navbar>


<main class="auth-page">

  <section class="auth-section">

    <div class="register-container">


      <div class="auth-introduction">

        <span class="eyebrow">
          ÚNETE A BARBERGO
        </span>

        <h1>
          Tu próximo corte empieza aquí.
        </h1>

        <p>
          Crea tu cuenta para reservar
          con tus barberos favoritos y
          administrar todas tus citas.
        </p>

      </div>


      <div class="auth-card">

        <div class="auth-card-heading">

          <span>
            CREAR CUENTA
          </span>

          <h2>
            Regístrate
          </h2>

        </div>


        <form
          (ngSubmit)="submit()"
        >

          <div class="form-grid">


            <div class="form-field">

              <label
                for="first-name"
              >
                Nombre *
              </label>

              <input
                id="first-name"
                name="firstName"
                type="text"

                autocomplete="given-name"

                [(ngModel)]="firstName"

                minlength="2"
                maxlength="100"

                required
              >

            </div>


            <div class="form-field">

              <label
                for="last-name"
              >
                Apellido *
              </label>

              <input
                id="last-name"
                name="lastName"
                type="text"

                autocomplete="family-name"

                [(ngModel)]="lastName"

                minlength="2"
                maxlength="100"

                required
              >

            </div>

          </div>


          <div class="form-field">

            <label
              for="email"
            >
              Correo electrónico *
            </label>

            <input
              id="email"
              name="email"
              type="email"

              autocomplete="email"

              placeholder="tu@correo.com"

              [(ngModel)]="email"

              required
            >

          </div>


          <div class="form-field">

            <label
              for="phone"
            >
              Teléfono
            </label>

            <input
              id="phone"
              name="phone"
              type="tel"

              autocomplete="tel"

              maxlength="30"

              placeholder="300 000 0000"

              [(ngModel)]="phone"
            >

          </div>


          <div class="form-grid">


            <div class="form-field">

              <label
                for="password"
              >
                Contraseña *
              </label>

              <input
                id="password"
                name="password"
                type="password"

                autocomplete="new-password"

                minlength="8"
                maxlength="128"

                [(ngModel)]="password"

                required
              >

            </div>


            <div class="form-field">

              <label
                for="confirm-password"
              >
                Confirmar *
              </label>

              <input
                id="confirm-password"
                name="confirmPassword"
                type="password"

                autocomplete="new-password"

                minlength="8"
                maxlength="128"

                [(ngModel)]="confirmPassword"

                required
              >

            </div>

          </div>


          @if (error) {

            <div class="auth-error">

              {{ error }}

            </div>

          }


          <button
            type="submit"
            class="auth-submit"

            [disabled]="loading"
          >

            @if (loading) {

              <span>
                Creando cuenta...
              </span>

            }

            @else {

              <span>
                Crear mi cuenta
              </span>

              <span>
                →
              </span>

            }

          </button>

        </form>


        <div class="auth-footer">

          <span>
            ¿Ya tienes una cuenta?
          </span>

          <a
          routerLink="/login"
          queryParamsHandling="preserve">
          Iniciar sesión
          </a>

        </div>

      </div>

    </div>

  </section>

</main>


<app-footer></app-footer>
