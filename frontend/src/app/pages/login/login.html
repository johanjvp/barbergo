<app-navbar></app-navbar>


<main class="auth-page">

  <section class="auth-section">

    <div class="auth-container">


      <div class="auth-introduction">

        <span class="eyebrow">
          BARBERGO
        </span>

        <h1>
          Bienvenido de nuevo.
        </h1>

        <p>
          Inicia sesión para reservar,
          administrar tus citas y descubrir
          tus barberías favoritas.
        </p>

      </div>


      <div class="auth-card">

        <div class="auth-card-heading">

          <span>
            INICIAR SESIÓN
          </span>

          <h2>
            Entra a tu cuenta
          </h2>

        </div>


        <form
          (ngSubmit)="submit()"
        >


          <div class="form-field">

            <label
              for="email"
            >
              Correo electrónico
            </label>

            <input
              id="email"
              name="email"
              type="email"

              autocomplete="email"

              placeholder="tu@correo.com"

              [(ngModel)]="email"

              required
            >

          </div>


          <div class="form-field">

            <label
              for="password"
            >
              Contraseña
            </label>

            <input
              id="password"
              name="password"
              type="password"

              autocomplete="current-password"

              placeholder="Tu contraseña"

              [(ngModel)]="password"

              minlength="8"

              required
            >

          </div>


          @if (error) {

            <div class="auth-error">

              {{ error }}

            </div>

          }


          <button
            type="submit"
            class="auth-submit"

            [disabled]="loading"
          >

            @if (loading) {

              <span>
                Ingresando...
              </span>

            }

            @else {

              <span>
                Iniciar sesión
              </span>

              <span>
                →
              </span>

            }

          </button>

        </form>


        <div class="auth-footer">

          <span>
            ¿Todavía no tienes cuenta?
          </span>

          <a
  routerLink="/registro"
  queryParamsHandling="preserve"
>
  Crear cuenta
</a>

        </div>

      </div>

    </div>

  </section>

</main>


<app-footer></app-footer>
